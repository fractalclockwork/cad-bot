[project]
name = "cad-bot"
version = "0.1.0"
description = "CadQuery-only parametric KP08 pillow block pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "cadquery==2.4.0",
    "ezdxf>=1.3.0",
    # nptyping (CadQuery dep) breaks on NumPy 2.0+ (removed np.bool8)
    "numpy>=1.24,<2",
    "trimesh>=4.0.0",
    "matplotlib>=3.8.0",
    "Pillow>=10.0.0",
    "scipy>=1.11,<2",
]

[tool.uv]
package = false
